name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Run MarkdownFlow unit tests
        run: python -m unittest discover -s MarkdownFlow/tests -t MarkdownFlow -v
      - name: Run MarkdownFold unit tests
        run: python -m unittest discover -s MarkdownFold/tests -t MarkdownFold -v
      - name: Run MarkdownGlanceBar unit tests
        run: python -m unittest discover -s MarkdownGlanceBar/tests -t MarkdownGlanceBar -v
